name: sqlite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Native oracle and AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc clang zlib1g-dev
      - name: Reproduce SQLite translation and native differentials
        working-directory: sqlite
        env:
          SQLITE_AOT: '1'
        run: scripts/verify.sh
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-validation
          path: |
            sqlite/artifacts/*.log
            sqlite/artifacts/*.out
          if-no-files-found: ignore
