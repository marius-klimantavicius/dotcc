[global]
server role = standalone server
workgroup = WORKGROUP
security = user
map to guest = Never
server min protocol = SMB2_02
server max protocol = SMB3_11
server signing = auto
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
log level = 1

[probe]
path = /srv/share
read only = no
valid users = smbprobe

[encrypted]
path = /srv/share
read only = no
valid users = smbprobe
smb encrypt = required
