[global]
server role = standalone server
workgroup = WORKGROUP
security = user
map to guest = Never
server min protocol = SMB2_02
server max protocol = SMB3_11
server signing = mandatory
host msdfs = yes
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
[dfs]
path = /srv/dfs
msdfs root = yes
read only = yes
valid users = smbprobe
[alpha]
path = /srv/alpha
read only = yes
valid users = smbprobe
[beta]
path = /srv/beta
read only = yes
valid users = smbprobe
